name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Package and checksum
        shell: bash
        run: |
          mkdir -p dist
          install -m 0755 target/release/proxyctl dist/proxyctl-x86_64-unknown-linux-gnu
          cd dist
          sha256sum proxyctl-x86_64-unknown-linux-gnu > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
