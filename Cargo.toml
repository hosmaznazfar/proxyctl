[package]
name = "proxyctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A lightweight CLI for managing and benchmarking proxy nodes"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
tabled = { version = "0.22", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
redb = "4.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
semver = "1.0.28"
ureq = "3.5.2"
curl = "0.4.51"
thiserror = "2.0.21"
tempfile = "3.27.0"
url = "2.5.8"
flate2 = "1.1"
libc = "0.2.191"
tar = "0.4"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
