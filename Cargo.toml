[package]
name = "proxyctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight CLI for managing and benchmarking proxy nodes"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
percent-encoding = "2.3.2"
redb = "4.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
semver = "1.0.27"
ureq = "3.1.4"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
