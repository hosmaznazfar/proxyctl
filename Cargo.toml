[package]
name = "proxyctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight CLI for managing and benchmarking proxy nodes"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
redb = "4.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.21"
tracing = "0.1.44"
